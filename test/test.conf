set -g default-terminal "tmux-256color"
set -g prefix C-a
bind-key C-a send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

run-shell "~/Projects/tmux-canvas-plugin/tmux-canvas.tmux"

bind-key S run-shell "bash ~/Projects/tmux-canvas-plugin/scripts/canvas_state.sh"

bind-key L display-popup -E "echo 'Canvases:'; echo ''; ls -1 ~/Projects/tmux-canvas-plugin/canvases 2>/dev/null | sed 's/\.sh$//' | nl || echo 'No canvases yet'"

bind-key r source-file ~/Projects/tmux-canvas-plugin/test/test.conf \; display-message "Config reloaded!"

bind-key H display-popup -E "tmux show-hooks -g"

bind-key M show-messages

bind-key 1 new-window -n "test1" \; split-window -h
bind-key 2 new-window -n "test2" \; split-window -v \; split-window -h

set -g status-style bg=yellow,fg=black
set -g status-left "[TEST MODE] "
set -g status-right "Canvases: ~/Projects/tmux-canvas-plugin/canvases "
