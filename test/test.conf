set -g default-terminal "tmux-256color"
set -g base-index 1
setw -g pane-base-index 1
# commands to unbind the default tmux prefix 
#
# kill window shortcut
bind-key k kill-window

## replace with the directory of your test enviroment
run-shell "~/projects/tmux-layouts/tmux-layouts.tmux"

## replace all directories below with those in your test enviroment
bind-key S run-shell "bash ~/projects/tmux-layouts/scripts/layout_state.sh"

bind-key L display-popup -E "echo 'Layouts:'; echo ''; ls -1 ~/projects/tmux-layouts/layouts 2>/dev/null | sed 's/\.sh$//' | nl || echo 'No layouts yet'"

bind-key r source-file ~/projects/tmux-layouts/test/test.conf \; display-message "Config reloaded!"

bind-key H display-popup -E "tmux show-hooks -g"

bind-key M show-messages

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# commands to change window splitting 
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# pane navigation
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g status-style bg=yellow,fg=black
set -g status-left "[TEST MODE] "
set -g status-right "Layouts: ~/projects/tmux-layouts/layouts "
